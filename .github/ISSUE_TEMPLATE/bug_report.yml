name: Bug report
description: Something in SPIKE does not work as documented.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. spike serve --open\n2. ..."
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of `spike doctor`
      description: Hardware, llama.cpp build and model. Remove anything private; never paste API keys.
      render: text
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: SPIKE version or commit
