name: Preparation checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  preparation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (pinned)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check preparation files
        shell: bash
        run: |
          set -euo pipefail
          test -s AGENTS.md
          test -s GEMINI.md
          test -s PLAN.md
          test -s PLAN.sha256
          sha256sum --check PLAN.sha256
          test -s docs/spikes/2026-10-16-plan-source-gate.md
          grep -q 'Plan Maestro v3' AGENTS.md
          grep -q 'Fase 0' GEMINI.md
          echo 'Preparation checks passed; this is not the v1.0 product CI.'
      - name: Validate Phase 0 diagnostic scripts
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/phase0/preflight.sh scripts/phase0/smoke_http.sh
          python3 -m py_compile scripts/phase0/http_probe.py scripts/phase0/rss_monitor.py scripts/phase0/gate_report.py scripts/phase0/paired_bootstrap.py scripts/phase0/hash_artifacts.py scripts/phase0/decontam_check.py scripts/phase0/s7_readiness.py
      - name: Verify Phase 0 gate and HTTP harness tests
        shell: bash
        run: make test
      - name: Check internal skill metadata
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          names = (
              'honest-claims', 'eval-gate', 'data-license-audit',
              'specialist-factory', 'clean-room', 'release-checklist',
          )
          for name in names:
              path = Path('.agent/skills') / name / 'SKILL.md'
              source = path.read_text(encoding='utf-8')
              assert source.startswith('---\n') and f'\nname: {name}\n' in source, path
              assert '\ndescription: ' in source, path
          print(f'Validated {len(names)} internal skills.')
          PY
