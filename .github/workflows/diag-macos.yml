name: diag macOS psutil (temporary)
on:
  push:
    branches: [diag-macos-psutil]
permissions:
  contents: read
jobs:
  diag:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - run: python diag/diag.py
      - run: python -m pip install -e ".[dev]"
      - run: pytest -q tests/test_real_model_check.py --durations=8
        env:
          SPIKE_NO_KEYRING: "1"
