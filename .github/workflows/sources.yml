name: Training sources evidence

# Manual only. Reads the Hugging Face Hub (public metadata, dataset cards, rows) for the training sources marked
# `license_status: unverified` and uploads the evidence as a run artifact for review. It changes nothing in the
# repository, uses no secrets and never marks a source verified: a reviewer does that in training/datasets.yaml.
on:
  workflow_dispatch:
    inputs:
      names:
        description: "Registry names, space-separated (empty: every unverified source)"
        type: string
        default: ""
      probe:
        description: "Hub datasets not in the registry, space-separated: metadata and card only (instead of names)"
        type: string
        default: ""

permissions:
  contents: read

jobs:
  evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - run: python -m pip install datasets httpx pyyaml
      - name: Read the Hub and stream every row of each source
        env:
          NAMES: ${{ inputs.names }}
          PROBE: ${{ inputs.probe }}
        run: |
          # shellcheck disable=SC2086
          python training/verify_sources.py ${PROBE:+--probe $PROBE} ${NAMES:+--names $NAMES} --out sources-report.json || echo "some sources failed; see the report"
          pip freeze | grep -iE '^(datasets|huggingface.hub|httpx)==' > versions.txt
      - name: The report in the log too (for reviewers who cannot download artifacts)
        run: cat versions.txt sources-report.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sources-report
          path: |
            sources-report.json
            versions.txt
