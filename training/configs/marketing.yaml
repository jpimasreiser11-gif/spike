# Spike Marketing adapter recipe. No sufficiently large, permissively licensed marketing corpus was found, so the domain
# data is produced by teacher distillation. No text written by an AI assistant may become training data, so the recipe has
# no seed prompts: it has short topic labels (training/topics/marketing.yaml), the open teacher writes every task from
# them and then the answers (rubric-filtered), and no label is ever in a training row.
specialist: marketing
base_model: Qwen/Qwen3.5-4B
hypothesis: >
  Rubric-filtered distillation from a stronger open teacher on realistic marketing tasks (written by the teacher from
  topic labels) improves
  specificity and actionability of the 4B model's marketing answers (pairwise judged win rate > 60 %)
  without degrading general knowledge.
acceptance:
  primary: {suite: marketing-pairwise, min_win_rate: 0.60, prompts: evals/data/marketing_eval.jsonl}   # held-out, judged once
  regression: {suite: general, max_drop_points: 1.5}
domain_sources: []
distill:
  enabled: true
  teacher: {repo: Qwen/Qwen3.6-35B-A3B, served_as: mlx-community/Qwen3.6-35B-A3B-4bit}   # license read from the Hub first
  topics: training/topics/marketing.yaml   # labels are instructions to the teacher only; none is ever in a training row
  kinds: {open: 1}
  expand_to: 6000                     # tasks the teacher writes from the labels, deduplicated; fewer rows are kept
  min_score: 8
replay:
  ratio: 0.35
  sources:
    - {source: oasst2, max: 4000}        # human-written only
decontaminate_against: [mmlu-pro]
decontaminate_files: [evals/data/marketing_eval.jsonl]   # held-out pairwise prompts
valid_fraction: 0.03
seed: 0
train:
  epochs: 1.0                         # prepare.py turns this into mlx-lm `iters` (micro-batches) from the data size
  batch_size: 1                       # 4 x 2048 tokens ran out of Metal memory on a 36 GB Mac
  grad_accumulation_steps: 16         # effective batch 16, same number of optimizer updates
  learning_rate: 1.0e-4
  lr_schedule: {name: cosine_decay, warmup: 60, arguments: [1.0e-4, auto, 1.0e-5]}
  max_seq_length: 768                 # Metal peak grows ~19 MB/token in training (Qwen3.5-4B, 36 GB Mac); longer chats are dropped
  grad_checkpoint: true
  mask_prompt: true
  num_layers: -1
  lora_parameters:
    rank: 16
    scale: 2.0
    dropout: 0.05
    keys: [self_attn.q_proj, self_attn.k_proj, self_attn.v_proj, self_attn.o_proj, mlp.gate_proj, mlp.up_proj, mlp.down_proj]
