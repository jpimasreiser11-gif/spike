# BLOCKED by the license review of 2026-11-02 (M7). The human-written source this recipe was built on,
# WikiSQL (no license on the Hub, a loading script that current `datasets` cannot run, and tables from
# Wikipedia under CC BY-SA), was rejected,
# and no candidate on the Hub under a license on the training allowlist was found (docs/TRAINING.md lists
# what was probed). It needs hand-written seed tasks and verified distillation from an open teacher, as
# marketing does; until then prepare.py stops with no domain data. Hyperparameters and thresholds are hypotheses.
# The `data` acceptance suite is empty until an eval set passes the review (evals/suites.yaml).
specialist: data
base_model: Qwen/Qwen3.5-4B
hypothesis: >
  Human-authored data examples may improve held-out data accuracy without degrading general knowledge.
acceptance:
  primary: {suite: data, min_gain_points: 3.0, max_p_value: 0.05}
  regression: {suite: general, max_drop_points: 1.5}
domain_sources: []
replay:
  ratio: 0.3
  sources:
    - {source: oasst2, max: 13000}
eval:
  max_tokens: 2048
decontaminate_against: [mmlu-pro]
valid_fraction: 0.02
seed: 0
train:
  epochs: 1.0
  batch_size: 1
  grad_accumulation_steps: 16
  learning_rate: 1.0e-4
  max_seq_length: 768
  grad_checkpoint: true
  mask_prompt: true
  num_layers: -1
  lora_parameters:
    rank: 16
    scale: 2.0
    dropout: 0.05
    keys: [self_attn.q_proj, self_attn.k_proj, self_attn.v_proj, self_attn.o_proj, mlp.gate_proj, mlp.up_proj, mlp.down_proj]
