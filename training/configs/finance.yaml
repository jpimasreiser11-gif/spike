# Spike Finance adapter recipe.
specialist: finance
base_model: Qwen/Qwen3.5-4B          # Apache-2.0; mlx-lm loads and trains it in bf16 (no QLoRA, see ADR 0002)
hypothesis: >
  LoRA on permissively licensed, human-annotated finance data (news and tweet classification and entity extraction
  from Sujet-Finance, plus FinQA and TAT-QA questions with their calculations) improves exact-answer finance
  reasoning of the 4B base, measured on the held-out FinQA and TAT-QA test sets (FinQA in the gold-facts setting:
  the supporting facts are given, so it is not comparable with retriever-based leaderboards) and MMLU-Pro
  business and economics, without degrading general knowledge.
acceptance:
  primary: {suite: finance, min_gain_points: 3.0, max_p_value: 0.05}
  regression: {suite: general, max_drop_points: 1.5}
domain_sources:
  - {source: sujet-finance, max: 8000, max_per_value: 2000}   # the four audited upstream datasets (filter in datasets.yaml),
                                         # the first 2,000 rows of each, so one of them cannot fill the 8,000
  - {source: finqa-train}                # 6,251 questions, minus rows whose own arithmetic is wrong
  - {source: tatqa-train}                # all 13,215 questions (many are longer than max_seq_length and dropped)
replay:
  ratio: 0.3                          # share of general data in the training mix (anti-forgetting)
  sources:
    - {source: oasst2, max: 13000}       # human-written only; 13,002 chats are built from en+es
eval:
  max_tokens: 2048                    # base and adapter share it; calculations before "Answer:" need room
decontaminate_against: [mmlu-pro, finqa-test, tatqa-test]
valid_fraction: 0.02
seed: 0
train:
  epochs: 1.0                         # prepare.py turns this into mlx-lm `iters` (micro-batches) from the data size
  batch_size: 1                       # 4 x 2048 tokens ran out of Metal memory on a 36 GB Mac
  grad_accumulation_steps: 16         # effective batch 16, same number of optimizer updates
  learning_rate: 1.0e-4
  lr_schedule: {name: cosine_decay, warmup: 100, arguments: [1.0e-4, auto, 1.0e-5]}
  max_seq_length: 768                 # Metal peak grows ~19 MB/token in training (Qwen3.5-4B, 36 GB Mac); longer chats are dropped
  grad_checkpoint: true
  mask_prompt: true
  num_layers: -1
  lora_parameters:
    rank: 16
    scale: 2.0                        # mlx scale == PEFT alpha / r  (alpha 32 at r 16)
    dropout: 0.05
    keys: [self_attn.q_proj, self_attn.k_proj, self_attn.v_proj, self_attn.o_proj, mlp.gate_proj, mlp.up_proj, mlp.down_proj]
