# Topic labels for Spike Data (distill.topics of training/configs/data.yaml; spike_train/seeding.py).
provenance: >
  Short labels (plain noun phrases) for the kind of data a SQL exercise is about, chosen by an AI assistant (Claude) at the
  maintainer's request. They are instructions to the open teacher and nothing else: the teacher writes every SQLite schema,
  its rows, the question and the query from them; no label is copied into a task, an answer or a training row
  (tests/test_distill_topics.py). The five databases of evals/data/data_eval.jsonl are about other subjects:
  tests/test_heldout_evals.py keeps the two sets disjoint.
