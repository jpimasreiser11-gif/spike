# Topic labels for Spike Marketing (distill.topics of training/configs/marketing.yaml; spike_train/seeding.py).
provenance: >
  Short topic labels (plain noun phrases) chosen by an AI assistant (Claude) at the maintainer's request as an outline of
  the field. They are instructions to the open teacher and nothing else: the teacher writes every task from them and then
  the answers; no label is copied into a task, an answer or a training row (tests/test_distill_topics.py). The earlier
  hand-written-looking seed prompts of this recipe (training/seeds/marketing.jsonl) were also written by an AI assistant and
  were removed, because no AI-written text may become training data.
