# Topic labels for Spike Science (distill.topics of training/configs/science.yaml; spike_train/seeding.py).
provenance: >
  Short topic labels (plain noun phrases) chosen by an AI assistant (Claude) at the maintainer's request as a syllabus
  outline of physics, chemistry and biology at secondary and undergraduate level. They are instructions to the open teacher
  and nothing else: the teacher writes every multiple-choice and explanation task from them and then the answers; no label
  is copied into a task, an answer or a training row (tests/test_distill_topics.py). The held-out questions of
  evals/data/science_eval.jsonl are about other topics: tests/test_heldout_evals.py keeps the two sets disjoint.
groups:
  - context: secondary school physics
    labels:
      - uniform acceleration
      - projectile motion
      - Newton's laws of motion
      - friction on inclined planes
      - work and kinetic energy
      - conservation of momentum
      - simple harmonic motion
      - wave speed and frequency
      - sound and the Doppler effect
      - refraction of light
      - thin lenses
      - heat transfer and specific heat
      - ideal gas law
      - Ohm's law and series circuits
      - parallel circuits
      - electric field and charge
      - magnetic force on moving charges
      - electromagnetic induction
      - radioactive decay and half-life
  - context: undergraduate physics
    labels:
