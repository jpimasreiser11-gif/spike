    license: mit
    license_status: verified
    license_review: {date: '2026-11-02', by: Claude, hub_license: mit, hub_sha: 740312add88f781978c0658806c59bc2815b9866, rows: 7473, rows_formatted: 7473, evidence: 'https://github.com/jpimasreiser11-gif/spike/actions/runs/41407296157'}
    license_url: https://huggingface.co/datasets/openai/gsm8k
    role: train
