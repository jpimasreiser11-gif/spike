    license_status: verified
    license_review: {date: '2026-11-02', by: Claude, hub_license: cc-by-4.0, hub_sha: 4bb6404fdc6cacfda99d4ac4205087b89d32030c, rows: 374, rows_formatted: 374, evidence: 'https://github.com/jpimasreiser11-gif/spike/actions/runs/41407296157'}
    license_url: https://huggingface.co/datasets/google-research-datasets/mbpp
    role: train
    format: mbpp
    provenance: 'MBPP: crowdworker-written Python problems, reference programs and tests (card: crowdsourced, expert-generated);
