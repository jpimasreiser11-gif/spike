# Evaluation suites. Each task reads an eval-only source from training/datasets.yaml, takes a seeded random
# sample of `n` items (all items when n is omitted) and is answered by every variant with the same prompt.
# `general` is the regression suite: categories outside every specialist domain trained so far.
# `*-select` suites are for choosing between training runs, checkpoints or settings: `skip` takes the items after
# the acceptance sample of the same task, so with the same --seed (default 0) they never overlap it, and the
# acceptance suites are run once, on the chosen variant.
suites:
  medicine:
    specialist: medicine
    tasks:
      - {name: medmcqa-val, source: medmcqa-eval, n: 1000}
      - {name: pubmedqa-labeled, source: pubmedqa-labeled, n: 500}
      - {name: mmlu-pro-health, source: mmlu-pro, categories: [health]}
  finance:
    specialist: finance
    tasks:
      - {name: mmlu-pro-business, source: mmlu-pro, categories: [business]}
      - {name: mmlu-pro-economics, source: mmlu-pro, categories: [economics]}
      - {name: finqa-test, source: finqa-test, n: 600}
      - {name: tatqa-test, source: tatqa-test, n: 600}
  law:
    specialist: law
    tasks:
      - {name: casehold-test, source: casehold-test, n: 600}
      - {name: mmlu-pro-law, source: mmlu-pro, categories: [law], n: 600}
  math:
    specialist: math
    tasks:
      - {name: gsm8k, source: gsm8k, n: 500}
      - {name: mmlu-pro-math, source: mmlu-pro, categories: [math], n: 600}
  science:
    specialist: science
    tasks:
      - {name: openbookqa-test, source: openbookqa-test, n: 300}
      - {name: mmlu-pro-physics, source: mmlu-pro, categories: [physics], n: 400}
      - {name: mmlu-pro-chemistry, source: mmlu-pro, categories: [chemistry], n: 400}
      - {name: mmlu-pro-biology, source: mmlu-pro, categories: [biology], n: 400}
  code:
    specialist: code
    tasks:
      - {name: mbpp-test, source: mbpp-test, n: 300}
      - {name: mmlu-pro-cs, source: mmlu-pro, categories: [computer science]}
  general:
    specialist: core
    tasks:
      - {name: mmlu-pro-general, source: mmlu-pro, categories: [history, philosophy, psychology, other], n: 800}
  general-select:
    specialist: core
    tasks:
      - {name: mmlu-pro-general-select, source: mmlu-pro, categories: [history, philosophy, psychology, other], skip: 800, n: 400}
  medicine-select:
    specialist: medicine
    tasks:
      - {name: medmcqa-val-select, source: medmcqa-eval, skip: 1000, n: 400}
      - {name: pubmedqa-labeled-select, source: pubmedqa-labeled, skip: 500, n: 200}
  finance-select:                     # MMLU-Pro business and economics are used whole by `finance`: none left to select on
    specialist: finance
    tasks:
      - {name: finqa-test-select, source: finqa-test, skip: 600, n: 300}
      - {name: tatqa-test-select, source: tatqa-test, skip: 600, n: 300}
  law-select:
    specialist: law
    tasks:
      - {name: casehold-test-select, source: casehold-test, skip: 600, n: 300}
  science-select:
    specialist: science
    tasks:
      - {name: openbookqa-test-select, source: openbookqa-test, skip: 300, n: 150}
  math-select:
    specialist: math
    tasks:
      - {name: gsm8k-select, source: gsm8k, skip: 500, n: 300}
  code-select:
    specialist: code
    tasks:
      - {name: mbpp-test-select, source: mbpp-test, skip: 300, n: 150}
  data:
    specialist: data
    tasks:
      - {name: wikisql-test, source: wikisql-test, n: 600}
  data-select:
    specialist: data
    tasks:
      - {name: wikisql-test-select, source: wikisql-test, skip: 600, n: 300}

  # M6: writing is a literal diagnostic/export pool; writing acceptance is pairwise, never exact-title accuracy.
  education:
    specialist: education
    tasks:
    - name: qasc-eval
      source: qasc-eval
      n: 600
  education-select:
    specialist: education
    tasks:
    - name: qasc-select
      source: qasc-eval
      skip: 600
      n: 250
  core:
    specialist: core
    tasks:
    - name: commonsenseqa-eval
      source: commonsenseqa-eval
      n: 800
  core-select:
    specialist: core
    tasks:
    - name: commonsenseqa-select
      source: commonsenseqa-eval
      skip: 800
      n: 300
  business:
    specialist: business
    tasks:
    - name: banking77-eval
      source: banking77-eval
      n: 1200
  business-select:
    specialist: business
    tasks:
    - name: banking77-select
      source: banking77-eval
      skip: 1200
      n: 600
  security:
    specialist: security
    tasks:
    - name: phishing-url-eval
      source: phishing-url-eval
      n: 1200
  security-select:
    specialist: security
    tasks:
    - name: phishing-url-select
      source: phishing-url-eval
      skip: 1200
      n: 600
  writing:
    specialist: writing
    tasks:
    - name: billsum-eval
      source: billsum-eval
      n: 600
  writing-select:
    specialist: writing
    tasks:
    - name: billsum-select
      source: billsum-eval
      skip: 600
      n: 300
